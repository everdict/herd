syntax = "proto3";

// herd-guest's clock extension (DEFAUL-1595). A guest restored from a MEMORY snapshot, or resumed after its VM was
// paused for a snapshot, keeps the wall clock its memory held: a golden taken days ago would start every session days
// behind. herdlet hands the guest the host's time over this service before the VM is handed to anything that runs in
// it.
package herd.ext.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/everdict/herd/api/herdext/v1;herdext";

// ClockService sets the guest's wall clock.
service ClockService {
  // SetClock steps the guest's wall clock (CLOCK_REALTIME) to now, forwards or backwards; the monotonic clock is not
  // touched. An error means the guest's clock was not set.
  rpc SetClock(SetClockRequest) returns (SetClockResponse);
}

message SetClockRequest {
  // The host's wall clock when it sent the call.
  google.protobuf.Timestamp now = 1;
}

message SetClockResponse {
  // The guest's wall clock just before it was set, so the host can say how far it stepped.
  google.protobuf.Timestamp before = 1;
}
