syntax = "proto3";

// herd-guest's flush extension (PLT-195). herdlet calls it before every VM snapshot, so a snapshot (and the volume
// tree a suspend carries) holds what the guest wrote, not only what its page cache had already written back.
package herd.ext.v1;

option go_package = "github.com/everdict/herd/api/herdext/v1;herdext";

// SyncService flushes the guest's filesystems.
service SyncService {
  // Sync writes every container's writable data and the volume share back to their devices and the host, and
  // answers once they are durable there. An error means some of it may still be only in the guest's memory.
  rpc Sync(SyncRequest) returns (SyncResponse);
}

message SyncRequest {}

message SyncResponse {}
