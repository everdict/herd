syntax = "proto3";

// herd-guest's file metadata extension (PLT-104). agent-substrate/env's FileSystemService (ateenv.v1alpha) reads
// and writes files only; herd-guest serves it unchanged and adds stat and list here, under herd's own package, so a
// client that speaks only ateenv.v1alpha is not affected.
package herd.ext.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/everdict/herd/api/herdext/v1;herdext";

// FileInfoService answers metadata questions about paths in the target container, resolved exactly as
// ateenv.v1alpha.FileSystemService resolves them (absolute, or relative to the workspace; confined to the container).
service FileInfoService {
  // StatFile describes one path. A symbolic link is described itself, not followed.
  rpc StatFile(StatFileRequest) returns (FileInfo);

  // ListDirectory describes the entries of one directory, sorted by name.
  rpc ListDirectory(ListDirectoryRequest) returns (ListDirectoryResponse);
}

// FileType is the kind of a path.
enum FileType {
  FILE_TYPE_UNSPECIFIED = 0;
  FILE_TYPE_REGULAR = 1;
  FILE_TYPE_DIRECTORY = 2;
  FILE_TYPE_SYMLINK = 3;
  // A FIFO, socket or device.
  FILE_TYPE_OTHER = 4;
}

// FileInfo describes one path.
message FileInfo {
  // The path as resolved inside the container (absolute).
  string path = 1;
  // The last element of path.
  string name = 2;
  FileType type = 3;
  // Size in bytes.
  int64 size = 4;
  // POSIX permission bits (e.g. 0644).
  uint32 mode = 5;
  google.protobuf.Timestamp modified_at = 6;
  // For a symbolic link, its target as written in the link.
  string link_target = 7;
}

message StatFileRequest {
  // Absolute or workspace-relative path.
  string path = 1;
}

message ListDirectoryRequest {
  // Absolute or workspace-relative path of a directory.
  string path = 1;
}

message ListDirectoryResponse {
  repeated FileInfo entries = 1;
}
